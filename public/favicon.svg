  <line x1="26" y1="24" x2="38" y2="24" stroke="hsl(263,85%,65%)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="32" x2="42" y2="32" stroke="hsl(168,100%,50%)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="40" x2="38" y2="40" stroke="hsl(263,85%,65%)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="47" x2="42" y2="47" stroke="hsl(168,100%,50%)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
